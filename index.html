<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D Printer Simulation</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #10141f;
      --panel: #1a2334;
      --text: #edf2ff;
      --muted: #9fb0d0;
      --accent: #54c2ff;
      --good: #65f6a3;
      --warn: #ffcc66;
      --danger: #ff6b7d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #1b2740, var(--bg));
      color: var(--text);
      display: grid;
      grid-template-columns: 320px 1fr;
    }

    .panel {
      padding: 1rem;
      border-right: 1px solid #2b3650;
      background: linear-gradient(180deg, #1a2334, #141b2b);
      display: grid;
      gap: 1rem;
      align-content: start;
    }

    .card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 0.9rem;
    }

    h1 {
      margin: 0;
      font-size: 1.2rem;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .row {
      display: grid;
      gap: 0.4rem;
      margin-top: 0.75rem;
    }

    label {
      color: var(--muted);
      font-size: 0.85rem;
    }

    input[type="range"] {
      width: 100%;
    }

    .value {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--accent);
      font-size: 0.85rem;
    }

    .button-row {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-top: 0.8rem;
    }

    button {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0.45rem 0.7rem;
      color: #091220;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    button:active { transform: translateY(1px); }

    #startBtn { background: var(--good); }
    #pauseBtn { background: var(--warn); }
    #resetBtn { background: var(--danger); color: white; }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .metric {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 10px;
      padding: 0.55rem;
    }

    .metric dt {
      color: var(--muted);
      font-size: 0.74rem;
      margin-bottom: 0.2rem;
    }

    .metric dd {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text);
    }

    .view {
      padding: 1rem;
      display: grid;
      place-items: center;
    }

    canvas {
      width: min(100%, 980px);
      aspect-ratio: 4 / 3;
      border-radius: 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      background: #0d1118;
    }

    @media (max-width: 900px) {
      body {
        grid-template-columns: 1fr;
      }
      .panel {
        border-right: none;
        border-bottom: 1px solid #2b3650;
      }
    }
  </style>
</head>
<body>
  <aside class="panel">
    <section class="card">
      <h1>3D Printer Simulation</h1>
      <p class="subtitle">Watch a layer-by-layer print process with adjustable settings.</p>

      <div class="row">
        <label for="layers">Target layers</label>
        <input id="layers" type="range" min="10" max="180" value="75" />
        <span class="value" id="layersVal">75 layers</span>
      </div>

      <div class="row">
        <label for="speed">Print speed</label>
        <input id="speed" type="range" min="0.4" max="4" step="0.1" value="1.8" />
        <span class="value" id="speedVal">1.8x</span>
      </div>

      <div class="row">
        <label for="density">Infill density</label>
        <input id="density" type="range" min="10" max="95" step="1" value="35" />
        <span class="value" id="densityVal">35%</span>
      </div>

      <div class="button-row">
        <button id="startBtn" type="button">Start</button>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="resetBtn" type="button">Reset</button>
      </div>
    </section>

    <section class="card">
      <strong>Status</strong>
      <dl class="metrics">
        <div class="metric">
          <dt>Progress</dt>
          <dd id="progressPct">0%</dd>
        </div>
        <div class="metric">
          <dt>Layer</dt>
          <dd id="layerLabel">0 / 75</dd>
        </div>
        <div class="metric">
          <dt>Nozzle Temp</dt>
          <dd id="tempLabel">205°C</dd>
        </div>
        <div class="metric">
          <dt>ETA</dt>
          <dd id="etaLabel">--:--</dd>
        </div>
      </dl>
    </section>
  </aside>

  <main class="view">
    <canvas id="simCanvas" width="980" height="735"></canvas>
  </main>

  <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    const controls = {
      layers: document.getElementById('layers'),
      speed: document.getElementById('speed'),
      density: document.getElementById('density'),
      startBtn: document.getElementById('startBtn'),
      pauseBtn: document.getElementById('pauseBtn'),
      resetBtn: document.getElementById('resetBtn'),
      layersVal: document.getElementById('layersVal'),
      speedVal: document.getElementById('speedVal'),
      densityVal: document.getElementById('densityVal'),
      progressPct: document.getElementById('progressPct'),
      layerLabel: document.getElementById('layerLabel'),
      tempLabel: document.getElementById('tempLabel'),
      etaLabel: document.getElementById('etaLabel'),
    };

    const state = {
      running: false,
      targetLayers: Number(controls.layers.value),
      currentLayer: 0,
      layerProgress: 0,
      headX: 0,
      direction: 1,
      speed: Number(controls.speed.value),
      infillDensity: Number(controls.density.value),
      startedAt: 0,
      elapsedWhenPaused: 0,
    };

    const printer = {
      bedX: 180,
      bedY: 610,
      bedWidth: 640,
      bedHeight: 35,
      buildHeight: 470,
      headY: 165,
      trackLeft: 190,
      trackRight: 810,
      modelWidth: 280,
    };

    const easeInOut = (t) => 0.5 - 0.5 * Math.cos(Math.PI * t);

    function updateLabels() {
      controls.layersVal.textContent = `${state.targetLayers} layers`;
      controls.speedVal.textContent = `${state.speed.toFixed(1)}x`;
      controls.densityVal.textContent = `${state.infillDensity}%`;
    }

    function updateMetrics() {
      const pct = ((state.currentLayer + state.layerProgress) / state.targetLayers) * 100;
      controls.progressPct.textContent = `${Math.min(100, pct).toFixed(1)}%`;
      controls.layerLabel.textContent = `${state.currentLayer} / ${state.targetLayers}`;

      const temp = state.running ? 205 + Math.sin(performance.now() * 0.007) * 3 : 193;
      controls.tempLabel.textContent = `${temp.toFixed(0)}°C`;

      const completed = state.currentLayer + state.layerProgress;
      const remainLayers = Math.max(0, state.targetLayers - completed);
      const secPerLayer = 4.2 / state.speed;
      const etaSec = remainLayers * secPerLayer;
      const minutes = Math.floor(etaSec / 60);
      const seconds = Math.floor(etaSec % 60);
      controls.etaLabel.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function drawFrame() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#111827');
      grad.addColorStop(1, '#0b1020');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawPrinterFrame();
      drawPrintedModel();
      drawPrintHead();
    }

    function drawPrinterFrame() {
      ctx.fillStyle = '#2a334b';
      ctx.fillRect(120, 95, 740, 560);

      ctx.fillStyle = '#131c2f';
      ctx.fillRect(145, 120, 690, 510);

      ctx.fillStyle = '#5d6a86';
      ctx.fillRect(printer.bedX, printer.bedY, printer.bedWidth, printer.bedHeight);

      ctx.strokeStyle = '#91a0c2';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(printer.trackLeft, printer.headY);
      ctx.lineTo(printer.trackRight, printer.headY);
      ctx.stroke();
    }

    function drawPrintedModel() {
      const modelBaseX = (canvas.width - printer.modelWidth) / 2;
      const maxHeight = printer.buildHeight;
      const height = maxHeight * (state.currentLayer / state.targetLayers);
      const y = printer.bedY - height;

      ctx.fillStyle = '#3dd6a7';
      ctx.fillRect(modelBaseX, y, printer.modelWidth, height);

      ctx.strokeStyle = 'rgba(0, 0, 0, 0.25)';
      ctx.lineWidth = 1;
      const layersToDraw = state.currentLayer;
      const pixelPerLayer = maxHeight / state.targetLayers;
      for (let i = 1; i < layersToDraw; i += 1) {
        const ly = printer.bedY - i * pixelPerLayer;
        ctx.beginPath();
        ctx.moveTo(modelBaseX, ly);
        ctx.lineTo(modelBaseX + printer.modelWidth, ly);
        ctx.stroke();
      }

      ctx.strokeStyle = 'rgba(15, 30, 25, 0.4)';
      const spacing = 28 - (state.infillDensity / 95) * 20;
      for (let x = modelBaseX - printer.modelWidth; x < modelBaseX + printer.modelWidth * 2; x += spacing) {
        ctx.beginPath();
        ctx.moveTo(x, printer.bedY);
        ctx.lineTo(x + height, y);
        ctx.stroke();
      }
    }

    function drawPrintHead() {
      const travel = printer.trackRight - printer.trackLeft;
      const sweep = easeInOut((Math.sin(state.headX) + 1) / 2);
      const x = printer.trackLeft + sweep * travel;
      const y = printer.headY;

      ctx.fillStyle = '#f2b563';
      ctx.fillRect(x - 24, y - 16, 48, 32);
      ctx.fillStyle = '#d38d2a';
      ctx.fillRect(x - 9, y + 16, 18, 25);

      const modelTopY = printer.bedY - (printer.buildHeight * (state.currentLayer / state.targetLayers));
      if (state.running && modelTopY < printer.bedY) {
        ctx.strokeStyle = 'rgba(255, 170, 76, 0.8)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(x, y + 41);
        ctx.lineTo(x, modelTopY);
        ctx.stroke();
      }
    }

    function tick(delta) {
      if (state.running && state.currentLayer < state.targetLayers) {
        const progressDelta = (delta / 1000) * 0.24 * state.speed;
        state.layerProgress += progressDelta;
        state.headX += delta * 0.006 * state.speed * state.direction;

        if (state.layerProgress >= 1) {
          state.currentLayer += 1;
          state.layerProgress = 0;
          state.direction *= -1;
        }

        if (state.currentLayer >= state.targetLayers) {
          state.running = false;
          state.currentLayer = state.targetLayers;
        }
      }

      updateMetrics();
      drawFrame();
    }

    controls.layers.addEventListener('input', () => {
      state.targetLayers = Number(controls.layers.value);
      state.currentLayer = Math.min(state.currentLayer, state.targetLayers);
      updateLabels();
      updateMetrics();
      drawFrame();
    });

    controls.speed.addEventListener('input', () => {
      state.speed = Number(controls.speed.value);
      updateLabels();
    });

    controls.density.addEventListener('input', () => {
      state.infillDensity = Number(controls.density.value);
      updateLabels();
      drawFrame();
    });

    controls.startBtn.addEventListener('click', () => {
      if (state.currentLayer >= state.targetLayers) {
        state.currentLayer = 0;
        state.layerProgress = 0;
      }
      state.running = true;
      if (!state.startedAt) {
        state.startedAt = performance.now();
      }
    });

    controls.pauseBtn.addEventListener('click', () => {
      state.running = false;
      state.elapsedWhenPaused = performance.now() - state.startedAt;
    });

    controls.resetBtn.addEventListener('click', () => {
      state.running = false;
      state.currentLayer = 0;
      state.layerProgress = 0;
      state.headX = 0;
      state.direction = 1;
      state.startedAt = 0;
      state.elapsedWhenPaused = 0;
      updateMetrics();
      drawFrame();
    });

    let last = performance.now();
    function animate(now) {
      const delta = now - last;
      last = now;
      tick(delta);
      requestAnimationFrame(animate);
    }

    updateLabels();
    updateMetrics();
    drawFrame();
    requestAnimationFrame(animate);
  </script>
</body>
</html>
